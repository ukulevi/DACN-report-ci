# Research contract; current CLI takes flags and does NOT load this YAML.
status: ddpm_partial_trainer_implemented_method_contract_pending_ab_review
dataset:
  name: BMAD-Brain
  version: bmad-flair-patient-disjoint-v1
  archive_sha256: eb7a5aae9ea1752b16d3a76b47595ffd956c0b210444da76853455d4d7be61c8
  root: data/raw/bmad/BraTS2021_slice
  prepared: data/processed/bmad-flair-patient-disjoint-v1
  encoding: bmad-bone
  split_policy: patient-disjoint-v1
  modality: FLAIR_PNG_luminance
  image_size: 256
  original_size: 240
  normalization: uint8_div_127.5_minus_1
research:
  primary_method: ddpm_partial_reconstruction
  baseline_if_feasible: coarse_noise_DAE
  diffusion_schedule: proposal_1000_step_linear_pending_ab_review
  starting_timesteps_candidates: [100, 200, 300]
  additional_timesteps_if_budget_allows: [50, 500]
  score_maps: [pixel_absolute_difference, local_one_minus_ssim]
  final_train_seeds_target: [17, 42, 2026]
  optional_extensions: [feature_difference, ANDi, VAE, isolation_forest]
  initial_validation_sweep:
    status: proposal_pending_ab_review
    train_seed: 17
    sampling_base_seed: 17
    sampling_seed_policy: sha256_uuid_v1_first_32_bits
    inference_batch_size: 1
    checkpoint_count: 1
    train_and_validation_caps: null
    validation_slices: 83
    reconstruction_count: 249
    timesteps: [100, 200, 300]
    scores: [pixel_absolute_difference, local_one_minus_ssim]
evaluation:
  primary: global_pixel_average_precision
  crop_padding: true
  image_score: mean_top_1_percent
  threshold_source: validation_only
  test_locked_until: model_and_protocol_freeze
  bootstrap_unit: patient
  same_device_latency: true
  ssim:
    window: 11
    gaussian_sigma: 1.5
    data_range: 2.0
    padding: reflect_after_crop
    covariance: weighted_population
    k1: 0.01
    k2: 0.03
  sweep_tie_break: [smaller_timestep, pixel_absolute_difference]
  threshold_rule: validation_max_f1_ties_highest_score_threshold
