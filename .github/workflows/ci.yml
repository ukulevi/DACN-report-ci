name: CI
on:
  push:
    branches: [main, codex/bc-evaluation-colab]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[data,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m dacn.cli demo --output runs/ci-demo
