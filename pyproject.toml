[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dacn-medical-ad"
version = "0.1.0"
description = "Research framework for diffusion-based medical anomaly detection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scikit-learn>=1.3,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
data = ["pillow>=10", "gdown>=5,<7"]
train = ["torch>=2.2", "torchvision>=0.17", "tqdm>=4.66", "pillow>=10", "numba>=0.60,<1"]
medical = ["nibabel>=5", "pydicom>=2.4"]
hub = ["huggingface_hub>=0.28,<3", "python-dotenv>=1,<2"]
cloud = ["modal>=0.73"]
dev = ["pytest>=8", "ruff>=0.6", "build>=1"]

[project.scripts]
dacn = "dacn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
